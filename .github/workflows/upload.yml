name: Upload

# develop / release/** への push で Archive → IPA Export → App Store Connect へアップロードする。
on:
  push:
    branches:
      - develop
      - 'release/**'

permissions:
  contents: read

# アップロード途中でキャンセルすると App Store Connect 側に中途半端なビルドが残るため、
# 実行中のものは完了させる
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    # テンプレートリポジトリ自身など、配信しないリポジトリではリポジトリ変数 ENABLE_DELIVERY=false でスキップする。
    # 変数が未設定のリポジトリ（テンプレートから作成した直後を含む）では従来どおり実行される
    if: vars.ENABLE_DELIVERY != 'false'
    uses: ./.github/workflows/_archive.yml
    with:
      upload: true
    secrets: inherit
