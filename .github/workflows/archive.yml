name: Archive

# main への push で Archive → IPA Export まで通ることを確認する（アップロードはしない）。
# develop / release/** は upload.yml が Archive を含むため、ここでは実行しない。
# 必要なときに手動でも確認できるよう workflow_dispatch も置く。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    # テンプレートリポジトリ自身など、配信しないリポジトリではリポジトリ変数 ENABLE_DELIVERY=false でスキップする。
    # 変数が未設定のリポジトリ（テンプレートから作成した直後を含む）では従来どおり実行される
    if: vars.ENABLE_DELIVERY != 'false'
    uses: ./.github/workflows/_archive.yml
    with:
      upload: false
    secrets: inherit
